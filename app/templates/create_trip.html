{% extends "base.html" %}

{% block title %}创建旅行{% endblock %}

{% block content %}
<section class="page-stack">
  <header class="page-header">
    <a class="text-link" href="/trips">返回</a>
    <div>
      <p class="muted">创建旅行</p>
      <h1>给 Agent 一个起点</h1>
    </div>
  </header>

  <section class="form-helper-card" aria-label="创建提示">
    <strong>先不用填很完整</strong>
    <p>先给 Agent 一个简单背景，创建后可以直接在私人对话里继续补充。</p>
    <div class="helper-chips">
      <span>目的地</span>
      <span>日期</span>
      <span>预算</span>
      <span>不想要的安排</span>
    </div>
  </section>

  <form class="form-stack" action="/trips" method="post">
    <label>
      <span>目的地或旅行主题</span>
      <input name="destination" placeholder="例如：杭州周末旅行" required />
    </label>
    <label>
      <span>日期</span>
      <input name="date_range" placeholder="例如：8月24日 - 8月26日" />
    </label>
    <label>
      <span>预算</span>
      <input name="budget" placeholder="例如：人均 1500" />
    </label>
    <label>
      <span>旅行风格</span>
      <input name="style" placeholder="例如：轻松、亲子、少排队" />
    </label>
    <label>
      <span>补充说明</span>
      <textarea name="note" rows="4" placeholder="例如：不早起、少换酒店、想多留自由时间"></textarea>
    </label>
    <button class="primary-action button-reset" type="submit">创建并开始对话</button>
  </form>
</section>
{% endblock %}
