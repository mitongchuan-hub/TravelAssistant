{% extends "base.html" %}
{% block title %}创建行程{% endblock %}
{% block page_styles %}<link rel="stylesheet" href="{{ url_for('static', path='/workflow.css') }}?v={{ static_version }}" />{% endblock %}
{% block content %}
<section class="page-stack">
  <header class="page-header"><a class="text-link" href="/trips">返回</a><div><p class="muted">创建行程</p><h1>填写旅行基本信息</h1></div></header>
  <section class="form-helper-card"><strong>五组信息，作为行程起点</strong><p>抵离时间按旅行城市当地时间填写。必去、忌口和节奏等偏好，创建后在聊天里补充。</p></section>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form class="form-stack trip-create-form" action="/trips" method="post">
    <fieldset><legend>1. 旅行城市</legend><label><span>目的地城市</span><input name="city" value="{{ values.get('city', '') }}" maxlength="100" placeholder="例如：杭州" required /></label></fieldset>
    <fieldset><legend>2. 起止日期</legend><div class="create-field-row">
      <label><span>抵达日期</span><input type="date" name="start_date" value="{{ values.get('start_date', '') }}" required /></label>
      <label><span>离开日期</span><input type="date" name="end_date" value="{{ values.get('end_date', '') }}" required /></label>
    </div></fieldset>
    <fieldset><legend>3. 抵离时间和地点</legend><div class="create-field-row">
      <label><span>到达旅行城市的时间</span><input type="time" name="arrival_time" value="{{ values.get('arrival_time', '') }}" required /></label>
      <label><span>离开旅行城市的时间</span><input type="time" name="departure_time" value="{{ values.get('departure_time', '') }}" required /></label>
    </div><label><span>抵达地点</span><input name="arrival_location" value="{{ values.get('arrival_location', '') }}" maxlength="300" placeholder="例如：杭州东站" required /></label>
    <label><span>离开地点</span><input name="departure_location" value="{{ values.get('departure_location', '') }}" maxlength="300" placeholder="例如：杭州东站或萧山机场" required /></label></fieldset>
    <fieldset><legend>4. 旅行人数</legend><label><span>总人数（含自己）</span><input type="number" name="travelers" min="1" max="100" step="1" value="{{ values.get('travelers', '') }}" required /></label></fieldset>
    <fieldset><legend>5. 预算金额和口径</legend><div class="create-field-row">
      <label><span>预算金额（元）</span><input type="number" name="budget_amount" min="0.01" max="100000000" step="0.01" value="{{ values.get('budget_amount', '') }}" required /></label>
      <label><span>预算口径</span><select name="budget_scope" required><option value="">请选择</option><option value="total"{% if values.get('budget_scope') == 'total' %} selected{% endif %}>全部人的总预算</option><option value="per_person"{% if values.get('budget_scope') == 'per_person' %} selected{% endif %}>每人预算</option></select></label>
    </div><label><span>包含的费用范围</span><input name="budget_coverage" value="{{ values.get('budget_coverage', '') }}" maxlength="300" placeholder="例如：含住宿、餐饮、当地交通和门票，不含往返车票" required /></label></fieldset>
    <button class="primary-action button-reset" type="submit">创建并开始对话</button>
  </form>
</section>
{% endblock %}
