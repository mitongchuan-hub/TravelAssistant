function phone(n){return `<main class="phone t${n}" aria-label="${themes[n-1][0]}手机端静态设计"><div class="status"><span>9:41</span><div class="status-right">${icon('signal')}${icon('wifi')}<span class="battery"></span></div></div><header class="top"><button class="back" aria-label="返回我的旅行">${icon('back')}</button><div class="heading"><h1>杭州慢慢逛</h1><p>11月14日 — 15日 · 2天</p></div><button class="guide">${icon('book')}攻略</button></header><section class="content"><div class="context"><div class="context-title"><h2>把杭州，<br>走成喜欢的样子。</h2><p class="sub">从住处出发，也把轻松留给自己。</p></div>${flower(n-1)}<div class="meta"><span>${icon('pin')}住宿已匹配</span><span>${icon('bus')}公交地铁</span><span>${icon('heart')}慢节奏 · 少走路</span></div></div><div class="dayline">示例对话 · 10:24</div><div class="user-row"><p class="user-bubble">第一天想逛西湖和喝茶，<br>安排松一点，不要太赶。</p></div><div class="assistant-label"><span class="avatar">${icon('spark')}</span>旅行助手<small>10:24</small></div><article class="answer"><p>好，把第一天留给西湖和茶香。<br>已按你的想法调整路线，下午多留一点休息时间。</p><div class="route"><span>住处</span>${icon('arrow')}<span>西湖</span>${icon('arrow')}<span>喝茶</span>${icon('arrow')}<span>住处</span></div><p class="notice">${icon('info')}交通时间为查询时估算，营业与预约信息仍需出发前核实。</p><div class="result"><span>${icon('check')}行程已保存 · 草案</span><button class="open">查看攻略 ${icon('arrow')}</button></div></article><button class="undo">${icon('undo')}撤销上次修改 · 可撤销 1 步</button></section><footer class="dock"><div class="composer"><span>再说一个旅行想法…</span><button class="send" aria-label="发送消息">${icon('send')}</button></div><p class="dock-note">静态设计 · 测试展示，非真实行程</p></footer><nav class="bottom" aria-label="底部导航"><button class="nav">${icon('idea')}想法</button><button class="nav active" aria-current="page">${icon('chat')}聊天</button></nav><div class="home"></div></main>`}
const q=new URLSearchParams(location.search),n=Number(q.get('style'));
if(n>=1&&n<=10){document.title=String(n).padStart(2,'0')+' '+themes[n-1][0];document.getElementById('app').innerHTML=phone(n);document.body.style.background='var(--bg)'}else{document.getElementById('app').innerHTML=`<main class="gallery"><header class="gallery-head"><div><h1>旅行的样子，由你选。</h1><p>TravelAssistant · 10 款手机端设计提案<br>相同内容，不同视觉语言。可爱、圆润，也让每一步清楚好用。</p></div><span class="stamp">手机端 · 390 × 844 · 静态概念</span></header><section class="grid">${themes.map((t,i)=>`<article class="concept"><a href="?style=${i+1}" target="_blank" rel="noopener"><div class="mini"><iframe title="${t[0]}" src="?style=${i+1}" tabindex="-1" loading="eager"></iframe></div><h2>${String(i+1).padStart(2,'0')} / ${t[0]}</h2></a><p>${t[1]}</p></article>`).join('')}</section><footer class="gallery-foot"><span>真实功能骨架：住宿表单 → 地图匹配 → 聊天调整 → 攻略预览 / HTML 下载<br>底部仅保留「想法 / 聊天」；生成、调整、确认均通过聊天表达。</span><span>全部内容为测试展示 · 无后端请求 · 未改动正式页面<br>点击款式标题打开原尺寸预览；截图见同目录 images。</span></footer></main>`;const scaleFrames=()=>document.querySelectorAll('.mini').forEach(el=>{el.querySelector('iframe').style.transform=`scale(${el.clientWidth/390})`});new ResizeObserver(scaleFrames).observe(document.querySelector('.grid'));scaleFrames()}
</script>
</body></html>
