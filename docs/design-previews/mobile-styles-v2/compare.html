<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>第一组 / 第二组 · 手机设计对照</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf0ee;color:#293b31;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif}main{max-width:1020px;margin:auto;padding:30px 24px}h1{font-size:24px;font-weight:600;margin:0 0 10px}p{color:#5b6d61;font-size:13px;line-height:1.8}header{margin-bottom:22px}header a{color:inherit}label{display:flex;align-items:center;gap:10px;font-size:13px;margin-top:18px}select{min-height:44px;border:1px solid #bacabf;border-radius:9px;background:#fff;padding:0 12px;color:#293b31;font:inherit;max-width:70%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:32px}.col h2{font-size:15px;font-weight:600;margin:0 0 11px}.frame{width:100%;aspect-ratio:390/844;overflow:hidden;border-radius:22px;background:#fff;outline:1px solid #d0d9d2}.frame iframe{border:0;width:390px;height:844px;display:block;transform-origin:top left}.col p{font-size:12px;margin-top:13px}.note{margin-top:25px;border-top:1px solid #cbd6ce;padding-top:15px}@media(max-width:600px){main{padding:20px 13px}.pair{gap:13px}.col h2{font-size:12px}.frame{border-radius:12px}.col p{font-size:11px}}
</style></head><body><main><header><h1>看构造，不只看颜色。</h1><p>左：第一组原稿，未修改。右：第二组新稿。使用同一旅行场景，编号配对仅为浏览方便，不表示风格逐一替代。</p><label for="choice">选择对照<select id="choice"></select></label></header><section class="pair"><article class="col"><h2 id="old-title"></h2><div class="frame"><iframe id="old" title="第一组原稿"></iframe></div><p>原稿：大标题与装饰主导，卡片式聊天。</p></article><article class="col"><h2 id="new-title"></h2><div class="frame"><iframe id="new" title="第二组新稿"></iframe></div><p id="explanation"></p></article></section><p class="note">全部为手机端静态测试展示，无业务交互。<a href="index.html">第二组总览</a> · <a href="../mobile-styles/index.html">第一组总览</a> · <a href="RESEARCH.md">GitHub 源码研究记录</a></p></main><script>
const oldNames=['奶油手账','日系抹茶','桃桃气泡','天空棉花糖','韩系奶咖','多巴胺贴纸','柔和新拟物','圆润 Bento','旅行剪贴簿','软萌极简'];
const newNames=['亲切通讯录式','清爽对话式','旅行短记式','随身笔记式','日程便笺式','想法清单式','轻量工具式','柔和分区式','温暖阅读式','圆润原生式'];
const notes=['旅行依据收成一行，消息成为主角。','助手回复移出卡片，留出真实阅读空间。','用时间和连续条目组织，而非堆叠气泡。','回复组织为一页可读的行程便笺。','日期成为锚点，不再用大标题填满首屏。','想法以紧凑文本串联，不做漂浮贴纸。','结果与撤销归入同一清晰工具区。','整片底色表达对话分区，不套多层容器。','靠字级、行距与分隔建立温暖阅读节奏。','标准行式信息与轻圆角，回归日常应用。'];
const choice=document.getElementById('choice');choice.innerHTML=newNames.map((x,i)=>`<option value="${i+1}">${String(i+1).padStart(2,'0')} · ${x}</option>`).join('');
function update(){let n=Number(choice.value);document.getElementById('old').src=`../mobile-styles/index.html?style=${n}`;document.getElementById('new').src=`index.html?style=${n}`;document.getElementById('old-title').textContent=`A${String(n).padStart(2,'0')} ${oldNames[n-1]}`;document.getElementById('new-title').textContent=`B${String(n).padStart(2,'0')} ${newNames[n-1]}`;document.getElementById('explanation').textContent=notes[n-1]}
choice.addEventListener('change',update);update();const scale=()=>document.querySelectorAll('.frame').forEach(el=>el.querySelector('iframe').style.transform=`scale(${el.clientWidth/390})`);new ResizeObserver(scale).observe(document.querySelector('.pair'));scale();
</script></body></html>
