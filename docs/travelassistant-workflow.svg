<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1420" viewBox="0 0 1800 1420" role="img" aria-labelledby="title desc">
  <title id="title">TravelAssistant 私人旅行助手完整工作流</title>
  <desc id="desc">从创建旅行、收集想法和聊天，到 Agent 意图判断、工具查询、结构化行程生成、校验保存、确认和修改的完整工作流。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f7f7"/>
      <stop offset="1" stop-color="#e9eef7"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#112d4e"/>
      <stop offset="1" stop-color="#3f72af"/>
    </linearGradient>
    <linearGradient id="userLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#dbe2ef" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f9f7f7" stop-opacity=".65"/>
    </linearGradient>
    <linearGradient id="agentLane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8edf6" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f9f7f7" stop-opacity=".65"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#112d4e" flood-opacity=".12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#112d4e" flood-opacity=".09"/>
    </filter>
    <marker id="arrowBlue" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3f72af"/>
    </marker>
    <marker id="arrowDark" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#112d4e"/>
    </marker>
    <marker id="arrowRed" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 Z" fill="#b95757"/>
    </marker>
    <style>
      .font { font-family: "Microsoft YaHei", "Noto Sans CJK SC", "PingFang SC", Arial, sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #dbe2ef; }
      .section { font-size: 18px; font-weight: 800; fill: #112d4e; }
      .node-title { font-size: 19px; font-weight: 800; fill: #112d4e; }
      .node-text { font-size: 14px; font-weight: 500; fill: #334e68; }
      .small { font-size: 13px; font-weight: 500; fill: #486581; }
      .lane-label { font-size: 17px; font-weight: 800; fill: #112d4e; }
      .pill { font-size: 13px; font-weight: 700; fill: #3f72af; }
      .white-small { font-size: 13px; font-weight: 700; fill: #ffffff; }
      .line { fill: none; stroke: #3f72af; stroke-width: 3; marker-end: url(#arrowBlue); }
      .dark-line { fill: none; stroke: #112d4e; stroke-width: 3; marker-end: url(#arrowDark); }
      .red-line { fill: none; stroke: #b95757; stroke-width: 3; stroke-dasharray: 8 7; marker-end: url(#arrowRed); }
      .dashed { fill: none; stroke: #7894b8; stroke-width: 2.5; stroke-dasharray: 8 7; }
    </style>
  </defs>

  <rect width="1800" height="1420" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="44" y="36" width="1712" height="142" rx="26" fill="url(#hero)" filter="url(#shadow)"/>
  <text x="90" y="94" class="font title">TravelAssistant 私人旅行助手</text>
  <text x="90" y="130" class="font subtitle">从一句旅行想法，到可确认、可修改、可追溯的结构化行程</text>
  <text x="90" y="158" class="font subtitle">数据进入上下文 → Agent 判断阶段 → 工具补充事实 → JSON 校验 → 安全保存</text>
  <rect x="1452" y="79" width="242" height="52" rx="26" fill="#dbe2ef" fill-opacity=".18" stroke="#dbe2ef" stroke-opacity=".55"/>
  <text x="1573" y="112" text-anchor="middle" class="font white-small">雾蓝经典工作流</text>

  <!-- Main lanes -->
  <rect x="44" y="208" width="1712" height="1080" rx="26" fill="#f9f7f7" fill-opacity=".82" stroke="#dbe2ef" stroke-width="2"/>
  <rect x="65" y="230" width="1670" height="330" rx="22" fill="url(#userLane)"/>
  <rect x="65" y="580" width="1670" height="680" rx="22" fill="url(#agentLane)"/>
  <rect x="87" y="252" width="118" height="64" rx="18" fill="#dbe2ef"/>
  <text x="146" y="291" text-anchor="middle" class="font lane-label">用户入口</text>
  <text x="146" y="313" text-anchor="middle" class="font small">手机 Web</text>
  <rect x="87" y="602" width="118" height="64" rx="18" fill="#dbe2ef"/>
  <text x="146" y="641" text-anchor="middle" class="font lane-label">Agent 后端</text>
  <text x="146" y="663" text-anchor="middle" class="font small">Store + LLM</text>

  <!-- User entry nodes -->
  <g filter="url(#softShadow)">
    <rect x="250" y="254" width="210" height="112" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2"/>
    <text x="275" y="289" class="font node-title">创建旅行</text>
    <text x="275" y="318" class="font node-text">目的地 · 日期 · 预算</text>
    <text x="275" y="343" class="font node-text">风格 · 备注</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="520" y="254" width="230" height="112" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2"/>
    <text x="545" y="289" class="font node-title">想法墙</text>
    <text x="545" y="318" class="font node-text">手动添加旅行想法</text>
    <text x="545" y="343" class="font node-text">删除单条 · 空状态引导</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="810" y="254" width="230" height="112" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2"/>
    <text x="835" y="289" class="font node-title">聊天页</text>
    <text x="835" y="318" class="font node-text">补充需求 · 提问</text>
    <text x="835" y="343" class="font node-text">清空当前旅行聊天</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="1100" y="254" width="230" height="112" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2"/>
    <text x="1125" y="289" class="font node-title">生成计划</text>
    <text x="1125" y="318" class="font node-text">用户明确要求</text>
    <text x="1125" y="343" class="font node-text">或点击生成按钮</text>
  </g>
  <g filter="url(#softShadow)">
    <rect x="1390" y="254" width="280" height="112" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2"/>
    <text x="1415" y="289" class="font node-title">查看与反馈</text>
    <text x="1415" y="318" class="font node-text">查看行程 · 确认计划</text>
    <text x="1415" y="343" class="font node-text">提出某一项修改</text>
  </g>

  <path d="M460 310 H520" class="line"/>
  <path d="M750 310 H810" class="line"/>
  <path d="M1040 310 H1100" class="line"/>
  <path d="M1330 310 H1390" class="line"/>
  <path d="M635 366 V530 H925 V602" class="dashed" marker-end="url(#arrowBlue)"/>
  <path d="M925 366 V602" class="line"/>
  <path d="M1215 366 V530 H925 V602" class="dashed" marker-end="url(#arrowBlue)"/>
  <text x="774" y="518" class="font small">用户输入或操作触发后端处理</text>

  <!-- Agent workflow: intake -->
  <rect x="250" y="620" width="280" height="116" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2" filter="url(#softShadow)"/>
  <text x="275" y="658" class="font node-title">保存用户消息</text>
  <text x="275" y="687" class="font node-text">先保存正文与 thinking 占位</text>
  <text x="275" y="712" class="font node-text">后台任务继续处理</text>

  <rect x="590" y="620" width="300" height="116" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2" filter="url(#softShadow)"/>
  <text x="615" y="658" class="font node-title">构建旅行上下文</text>
  <text x="615" y="687" class="font node-text">旅行信息 · 最近对话 · 全部想法</text>
  <text x="615" y="712" class="font node-text">当前计划 · 版本 · 指标 · 当前日期</text>

  <rect x="950" y="620" width="300" height="116" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2" filter="url(#softShadow)"/>
  <text x="975" y="658" class="font node-title">意图与阶段判断</text>
  <text x="975" y="687" class="font node-text">继续聊天 / 询问确认</text>
  <text x="975" y="712" class="font node-text">用户同意生成 / 查看计划</text>

  <rect x="1310" y="620" width="330" height="116" rx="18" fill="#ffffff" stroke="#b8c7dc" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1335" y="658" class="font node-title">普通聊天 JSON</text>
  <text x="1335" y="687" class="font node-text">body · card · idea_cards · plan=null</text>
  <text x="1335" y="712" class="font node-text">next_action 决定下一步</text>

  <path d="M530 678 H590" class="line"/>
  <path d="M890 678 H950" class="line"/>
  <path d="M1250 678 H1310" class="line"/>

  <!-- Intent branch -->
  <path d="M1095 736 V790 H480 V850" class="line"/>
  <path d="M1095 736 V790 H835 V850" class="line"/>
  <path d="M1095 736 V790 H1190 V850" class="line"/>
  <path d="M1095 736 V790 H1510 V850" class="line"/>
  <text x="1080" y="778" text-anchor="middle" class="font small">按 next_action 分流</text>

  <rect x="310" y="850" width="340" height="112" rx="18" fill="#eef3fb" stroke="#8ea8c9" stroke-width="2"/>
  <text x="335" y="887" class="font node-title">继续补充</text>
  <text x="335" y="916" class="font node-text">保存想法卡片 · 回复聊天</text>
  <text x="335" y="941" class="font node-text">不修改当前计划</text>

  <rect x="665" y="850" width="340" height="112" rx="18" fill="#eef3fb" stroke="#8ea8c9" stroke-width="2"/>
  <text x="690" y="887" class="font node-title">询问是否生成</text>
  <text x="690" y="916" class="font node-text">用户选择“生成计划”</text>
  <text x="690" y="941" class="font node-text">或选择“继续补充”</text>

  <rect x="1020" y="850" width="340" height="112" rx="18" fill="#dbe2ef" stroke="#3f72af" stroke-width="2"/>
  <text x="1045" y="887" class="font node-title">进入最终规划</text>
  <text x="1045" y="916" class="font node-text">用户明确生成 / 点击按钮</text>
  <text x="1045" y="941" class="font node-text">加载最终行程 Skill</text>

  <rect x="1375" y="850" width="270" height="112" rx="18" fill="#eef3fb" stroke="#8ea8c9" stroke-width="2"/>
  <text x="1400" y="887" class="font node-title">展示当前计划</text>
  <text x="1400" y="916" class="font node-text">不生成新版本</text>
  <text x="1400" y="941" class="font node-text">用户可继续反馈</text>

  <!-- Tools -->
  <path d="M1190 962 V1002" class="line"/>
  <rect x="850" y="1002" width="680" height="104" rx="18" fill="#ffffff" stroke="#3f72af" stroke-width="2" filter="url(#softShadow)"/>
  <text x="875" y="1037" class="font node-title">工具查询（按需，最多一轮）</text>
  <rect x="875" y="1055" width="220" height="30" rx="15" fill="#dbe2ef"/>
  <text x="985" y="1076" text-anchor="middle" class="font pill">天气 / 温度 / 降雨</text>
  <rect x="1115" y="1055" width="220" height="30" rx="15" fill="#dbe2ef"/>
  <text x="1225" y="1076" text-anchor="middle" class="font pill">高德真实美食 POI</text>
  <rect x="1355" y="1055" width="145" height="30" rx="15" fill="#dbe2ef"/>
  <text x="1427" y="1076" text-anchor="middle" class="font pill">记录参数与结果</text>

  <path d="M850 1054 H735 V1142" class="line"/>
  <path d="M1530 1054 H1640 V1142" class="line"/>
  <rect x="505" y="1142" width="460" height="92" rx="18" fill="#ffffff" stroke="#3f72af" stroke-width="2" filter="url(#softShadow)"/>
  <text x="530" y="1178" class="font node-title">最终 JSON 输出</text>
  <text x="530" y="1207" class="font node-text">plan · days · items · preparation · risks</text>
  <rect x="1100" y="1142" width="540" height="92" rx="18" fill="#ffffff" stroke="#3f72af" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1125" y="1178" class="font node-title">本地日志</text>
  <text x="1125" y="1207" class="font node-text">输入 · 请求 · 原文 · 工具 · 校验 · 异常</text>

  <path d="M965 1188 H1015" class="line"/>
  <path d="M1190 1106 V1142" class="line"/>
  <path d="M1190 1234 V1262 H1730 V790 H1645" class="dashed" marker-end="url(#arrowBlue)"/>

  <!-- Validation and outcomes -->
  <rect x="250" y="1270" width="360" height="108" rx="18" fill="#ffffff" stroke="#3f72af" stroke-width="2" filter="url(#softShadow)"/>
  <text x="275" y="1306" class="font node-title">后端严格校验</text>
  <text x="275" y="1335" class="font node-text">字段完整 · 类型正确 · 分类合法</text>
  <text x="275" y="1360" class="font node-text">用餐结构 · 日期 · 天数 · 条目</text>

  <path d="M735 1234 V1270 H610" class="line"/>
  <path d="M610 1324 H700" class="line"/>
  <rect x="700" y="1270" width="430" height="108" rx="18" fill="#dbe2ef" stroke="#3f72af" stroke-width="2" filter="url(#softShadow)"/>
  <text x="725" y="1306" class="font node-title">通过：保存计划与版本</text>
  <text x="725" y="1335" class="font node-text">更新当前计划 · 保存 v1 / v2</text>
  <text x="725" y="1360" class="font node-text">整理想法 · 展示行程草案</text>

  <rect x="1220" y="1270" width="430" height="108" rx="18" fill="#fff3f1" stroke="#b95757" stroke-width="2" filter="url(#softShadow)"/>
  <text x="1245" y="1306" class="font node-title" fill="#8e3f45">失败：保护旧数据</text>
  <text x="1245" y="1335" class="font node-text">超时 / 限流 / 格式错误</text>
  <text x="1245" y="1360" class="font node-text">不覆盖旧计划，提示用户稍后重试</text>

  <path d="M965 1270 H1220" class="red-line"/>
  <text x="1090" y="1258" text-anchor="middle" class="font small" fill="#b95757">校验失败或请求失败</text>

  <!-- Side feedback loop -->
  <path d="M1645 906 C1730 906 1730 1245 1650 1245" class="dark-line"/>
  <text x="1663" y="1080" class="font small" transform="rotate(90 1663 1080)">反馈进入下一版</text>

  <!-- Bottom legend -->
  <rect x="65" y="1395" width="1670" height="1" fill="#b8c7dc"/>
  <circle cx="92" cy="1414" r="7" fill="#3f72af"/>
  <text x="108" y="1420" class="font small">正常流转</text>
  <circle cx="210" cy="1414" r="7" fill="#112d4e"/>
  <text x="226" y="1420" class="font small">反馈循环</text>
  <circle cx="330" cy="1414" r="7" fill="#b95757"/>
  <text x="346" y="1420" class="font small">失败保护</text>
  <text x="1510" y="1420" text-anchor="end" class="font small">数据保存在本地 SQLite；LLM 日志保存在 .cache/llm_logs</text>
</svg>
