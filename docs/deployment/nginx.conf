# 示例：将 frontend/dist 内容部署到 /srv/travelassistant/frontend。
# HTTPS 证书/域名由实际部署配置；使用HTTPS时后端 TRAVEL_COOKIE_SECURE=1。
server {
    listen 80;
    server_name localhost;
    root /srv/travelassistant/frontend;
    index index.html;

    # 保留浏览器公开主机；不要把上游内部地址当作 CSRF 允许来源。
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location = /api {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8000;
    }

    # 缺失资源必须404，不能被history fallback变成HTML。
    location /assets/ {
        try_files $uri =404;
    }

    location ~* \.(?:js|css|map|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        try_files $uri =404;
    }

    # 仅页面GET/HEAD允许SPA路由回退；写请求不伪装为成功页面。
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri $uri/ /index.html;
    }
}
