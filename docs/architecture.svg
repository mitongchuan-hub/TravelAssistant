<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1100" viewBox="0 0 1440 1100" role="img" aria-labelledby="title desc">
  <title id="title">TravelAssistant 当前项目架构与 Agent 执行流程</title>
  <desc id="desc">Vue 前端经 FastAPI 提交请求，服务端组装 Agent 输入，主 Agent 在内存消息列表中循环调用工具，变更通过原子提交保存到 SQLite，独立展示 Agent 将行程生成攻略网页。输入各部分已有校验，拼接后尚无统一 Schema 校验。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#59728c"/></marker>
    <style>
      text{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;fill:#112d4e}
      .heading{font-size:25px;font-weight:700}.sub{font-size:15px;fill:#526a80}.label{font-size:18px;font-weight:700}.body{font-size:16px}.small{font-size:14px;fill:#526a80}.mono{font-family:Consolas,"Microsoft YaHei",monospace;font-size:15px}
      .panel{fill:#fff;stroke:#c4d2e1;stroke-width:1.5}.band{fill:#edf3fa;stroke:#b7cbe2;stroke-width:1.5}.node{fill:#f5f8fc;stroke:#9ab7d7;stroke-width:1.5}.green{fill:#eff8f4;stroke:#8ebbaa;stroke-width:1.5}.warn{fill:#fff7e8;stroke:#d4a35b;stroke-width:1.5}
      .edge{fill:none;stroke:#59728c;stroke-width:2;marker-end:url(#arrow)}.dashed{stroke-dasharray:6 5}
    </style>
  </defs>
  <rect width="1440" height="1100" fill="#f9f7f7"/>
  <text x="48" y="54" class="heading">TravelAssistant · 当前架构与数据流</text>
  <text x="48" y="83" class="sub">聊天驱动业务 · 主 Agent 工具循环 · 原子保存 · 独立攻略网页生成</text>

  <rect x="40" y="110" width="1360" height="140" rx="18" class="band"/>
  <text x="64" y="142" class="label">01  用户界面 · Vue 3 / TypeScript / Vite</text>
  <rect x="64" y="161" width="375" height="65" rx="12" class="panel"/>
  <text x="84" y="188" class="label">聊天</text><text x="84" y="212" class="small">提出需求、生成、修改、确认与网页调整</text>
  <rect x="464" y="161" width="375" height="65" rx="12" class="panel"/>
  <text x="484" y="188" class="label">想法墙</text><text x="484" y="212" class="small">查看、添加、删除自由要求；生成快捷操作发送消息</text>
  <rect x="864" y="161" width="510" height="65" rx="12" class="panel"/>
  <text x="884" y="188" class="label">攻略预览</text><text x="884" y="212" class="small">隔离 iframe · 打开网页 · 下载 HTML · 状态轮询</text>

  <path d="M251 226V275" class="edge"/>
  <text x="269" y="269" class="small">JSON API</text>
  <rect x="64" y="287" width="375" height="110" rx="13" class="panel"/>
  <text x="84" y="317" class="label">02  FastAPI · 单后端进程</text>
  <text x="84" y="345" class="body">登录 / CSRF / 账号与旅行归属</text>
  <text x="84" y="372" class="small">创建任务、绑定请求与版本、后台执行、查询状态</text>

  <path d="M439 342H480" class="edge"/>
  <rect x="492" y="287" width="480" height="248" rx="13" class="panel"/>
  <text x="512" y="317" class="label">03  服务端组装 Agent 输入</text>
  <text x="512" y="347" class="mono">message       本轮完整原话与消息 ID</text>
  <text x="512" y="374" class="mono">current_date  当前日期</text>
  <text x="512" y="401" class="mono">conversation  最近 8 条用户与助手消息</text>
  <text x="512" y="428" class="mono">requirements  known + items + 缺项</text>
  <text x="512" y="455" class="mono">current_plan  当前版本行程 / 无则 null</text>
  <text x="512" y="485" class="small">附加系统提示词与 8 个工具定义</text>
  <text x="512" y="512" class="small">各部分筛选、裁剪与版本检查；业务旧入口仍兼容</text>

  <path d="M972 376H1005" class="edge"/>
  <rect x="1018" y="287" width="356" height="128" rx="13" class="warn"/>
  <text x="1038" y="318" class="label">当前输入校验边界</text>
  <text x="1038" y="349" class="body">已有请求与各字段的分散检查</text>
  <text x="1038" y="377" class="body">拼接后尚无统一 Schema 校验</text>
  <text x="1038" y="401" class="small">图示现状，不代表新增了校验模块</text>

  <path d="M732 535V571" class="edge"/>
  <rect x="40" y="584" width="932" height="260" rx="18" class="band"/>
  <text x="64" y="617" class="label">04  主 Agent · TaskExecutionRuntime</text>
  <rect x="64" y="640" width="260" height="169" rx="12" class="panel"/>
  <text x="84" y="670" class="label">本轮内存消息列表</text>
  <text x="84" y="700" class="mono">system + user 上下文</text>
  <text x="84" y="727" class="mono">+ assistant 工具调用</text>
  <text x="84" y="754" class="mono">+ tool 工具结果</text>
  <text x="84" y="786" class="small">逐次追加；非重启可恢复检查点</text>

  <rect x="382" y="657" width="220" height="110" rx="12" class="panel"/>
  <text x="402" y="690" class="label">调用 LLM</text>
  <text x="402" y="719" class="body">读取当前完整消息列表</text>
  <text x="402" y="746" class="small">判断意图、追问、查询或提交</text>
  <path d="M324 708H370" class="edge"/>
  <rect x="660" y="640" width="286" height="169" rx="12" class="panel"/>
  <text x="680" y="670" class="label">工具注册表 · 串行执行</text>
  <text x="680" y="700" class="body">原生高德地图 ×5 / 独立天气</text>
  <text x="680" y="727" class="body">read_context / submit_changes</text>
  <text x="680" y="756" class="small">参数 Schema、真实 POI、超时与取消</text>
  <text x="680" y="783" class="small">地图 / 天气适配器 → 外部服务</text>
  <path d="M602 708H648" class="edge"/>
  <path d="M803 640V629H194V640" class="edge"/>
  <text x="397" y="628" class="small">查询结果追加后，再次请求 LLM</text>
  <path d="M492 767V873" class="edge"/>
  <text x="342" y="861" class="small">普通正文 → 保存回复并结束</text>
  <path d="M946 752H1006" class="edge"/>
  <text x="984" y="735" class="small">提交变更</text>

  <rect x="1018" y="466" width="356" height="230" rx="13" class="green"/>
  <text x="1038" y="497" class="label">05  独立攻略展示 Agent</text>
  <text x="1038" y="529" class="body">输入：保存的正文、日期、展示偏好</text>
  <text x="1038" y="560" class="body">输出：完整 HTML / CSS 攻略</text>
  <text x="1038" y="593" class="small">正文是主数据，网页是派生展示</text>
  <text x="1038" y="620" class="small">生成失败保留正文；匹配的旧网页可继续查看</text>
  <text x="1038" y="647" class="small">禁脚本、禁同源权限、受限链接与 CSP</text>
  <text x="1038" y="674" class="small">生成成功不等于现实可执行性通过验收</text>
  <path d="M1196 466V431H1390V192H1374" class="edge"/>
  <path d="M1196 717V708" class="edge"/>

  <rect x="1018" y="720" width="356" height="124" rx="13" class="green"/>
  <text x="1038" y="752" class="label">变更校验与原子提交</text>
  <text x="1038" y="782" class="body">本轮授权 / 证据 / 账号 / 版本</text>
  <text x="1038" y="810" class="small">整包成功才保存；成功提交后结束本轮模型循环</text>

  <rect x="64" y="886" width="1310" height="122" rx="15" class="panel"/>
  <text x="84" y="919" class="label">06  SQLite · 业务持久化</text>
  <text x="84" y="950" class="body">旅行与结构化要求　｜　自由要求条目（想法墙）　｜　用户与助手消息　｜　当前行程　｜　任务与执行记录　｜　攻略产物</text>
  <text x="84" y="980" class="small">新一轮从保存状态重新组装上下文；进程重启不自动从上轮内存消息的中间步骤续跑</text>
  <path d="M492 873V886" class="edge"/>
  <path d="M1196 844V874" class="edge"/>
  <path d="M64 945H48V422H251V397" class="edge dashed"/>
  <text x="74" y="440" class="small">读取已保存状态</text>
  <text x="48" y="1053" class="small">实线：请求、执行与保存流向　　虚线：保存状态读取　　黄色：当前尚未覆盖的统一输入校验</text>
  <text x="48" y="1080" class="small">架构快照依据当前代码；历史 plan / revision / confirm 接口保留兼容，聊天是主要业务入口，前端想法墙继续保留。</text>
</svg>
