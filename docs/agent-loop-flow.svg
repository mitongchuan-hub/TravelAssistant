<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1220" viewBox="0 0 1700 1220" role="img" aria-labelledby="title desc">
  <title id="title">TravelAssistant 当前版本 Agent Loop 完整流程</title>
  <desc id="desc">展示一次旅行规划从用户消息、需求上下文、事实查询、路线查询、规划草案、确定性校验、一次修正到保存或等待用户的完整流程。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2f7"/>
    </linearGradient>
    <linearGradient id="bluePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e1e8ff"/>
    </linearGradient>
    <linearGradient id="greenPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d9f7e9"/>
    </linearGradient>
    <linearGradient id="orangePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#ffedd5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <filter id="smallShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#64748b" flood-opacity="0.12"/>
    </filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#536dfe"/>
    </marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#159570"/>
    </marker>
    <marker id="orangeArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <marker id="grayArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 30px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .panel-title { font: 700 19px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #263248; }
      .box-title { font: 700 16px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172033; }
      .box-text { font: 400 13px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #526074; }
      .small { font: 400 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #64748b; }
      .label { font: 600 12px "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #526074; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1700" height="1220" fill="url(#background)"/>
  <text x="80" y="62" class="title">TravelAssistant · 当前版本 Agent Loop 完整流程</text>
  <text x="80" y="92" class="subtitle">一个旅行 Agent，按需调用事实工具；系统负责绑定事实、校验规则和保护保存。</text>
  <rect x="1334" y="42" width="270" height="36" rx="18" fill="#ffffff" stroke="#dbe3ef"/>
  <circle cx="1358" cy="60" r="6" fill="#536dfe"/>
  <text x="1373" y="65" class="label">当前实现 · 受控有限循环</text>

  <!-- User input -->
  <rect x="80" y="135" width="1540" height="105" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <circle cx="125" cy="177" r="20" fill="#e0e7ff"/>
  <path d="M115 184c4-9 16-9 20 0M120 172a5 5 0 1 0 10 0" fill="none" stroke="#536dfe" stroke-width="2" stroke-linecap="round"/>
  <text x="165" y="180" class="panel-title">用户最新表达</text>
  <text x="165" y="211" class="box-text">例如：“杭州一天，灵隐寺必须去，东站往返，想轻松一点，请查真实地点和路线。”</text>
  <rect x="1300" y="163" width="270" height="42" rx="21" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1435" y="189" text-anchor="middle" class="label">聊天 / 生成 / 修改</text>

  <path d="M850 240 L850 274" stroke="#536dfe" stroke-width="2.5" marker-end="url(#blueArrow)"/>

  <!-- Context -->
  <rect x="80" y="274" width="1540" height="122" rx="18" fill="url(#bluePanel)" stroke="#aebcff" stroke-width="2" filter="url(#shadow)"/>
  <text x="116" y="310" class="panel-title">1 · 建立本次工作上下文</text>
  <text x="116" y="341" class="box-text">有效需求档案 + 最新消息 + 最近对话 + 当前行程版本 + 历史版本 + 想法 + 当前工具证据</text>
  <text x="116" y="368" class="box-text">同时记录需求修订号、行程版本 ID、本次目标和调用预算，防止旧结果覆盖新状态。</text>
  <rect x="1245" y="306" width="325" height="48" rx="12" fill="#ffffff" stroke="#c7d2fe"/>
  <text x="1407" y="327" text-anchor="middle" class="small">AgentLoopState</text>
  <text x="1407" y="345" text-anchor="middle" class="small">phase · goal · history · budget</text>

  <path d="M850 396 L850 432" stroke="#536dfe" stroke-width="2.5" marker-end="url(#blueArrow)"/>

  <!-- Loop main boundary -->
  <rect x="80" y="432" width="1540" height="510" rx="24" fill="#ffffff" stroke="#8f9ffb" stroke-width="2" filter="url(#shadow)"/>
  <text x="116" y="470" class="panel-title">2 · Agent Loop：每一轮只决定下一步动作</text>
  <rect x="1225" y="449" width="345" height="34" rx="17" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="1398" y="471" text-anchor="middle" class="label">有限步数 · 最多 32 次工具调用 · 明确终态</text>

  <!-- Decision -->
  <rect x="116" y="510" width="290" height="160" rx="16" fill="#eef2ff" stroke="#aebcff" filter="url(#smallShadow)"/>
  <text x="144" y="545" class="box-title">Agent 决定下一动作</text>
  <text x="144" y="577" class="box-text">理解：用户想要什么？</text>
  <text x="144" y="601" class="box-text">规划：还缺什么事实？</text>
  <text x="144" y="625" class="box-text">修改：哪些安排受影响？</text>
  <text x="144" y="649" class="box-text">结束：完成、等待还是失败？</text>

  <!-- Fact collection -->
  <rect x="468" y="496" width="330" height="190" rx="16" fill="url(#greenPanel)" stroke="#9bd9c2" filter="url(#smallShadow)"/>
  <text x="496" y="531" class="box-title">事实查询阶段</text>
  <text x="496" y="563" class="box-text">search_places：匹配灵隐寺</text>
  <text x="496" y="587" class="box-text">search_food：查询具体餐厅</text>
  <text x="496" y="611" class="box-text">query_weather：日期天气</text>
  <text x="496" y="635" class="box-text">query_route：相邻地点耗时</text>
  <text x="496" y="665" class="small">工具失败或重名 → 保留未知 / 等待用户</text>

  <!-- Observation -->
  <rect x="861" y="510" width="290" height="160" rx="16" fill="#f7fffb" stroke="#b7e5d4" filter="url(#smallShadow)"/>
  <text x="889" y="545" class="box-title">结果写回状态</text>
  <text x="889" y="577" class="box-text">地点 ID、地址、坐标与来源</text>
  <text x="889" y="601" class="box-text">路线方式、耗时、距离与时间</text>
  <text x="889" y="625" class="box-text">查询时间、失败原因与证据</text>
  <text x="889" y="649" class="box-text">Agent 再判断下一动作</text>

  <!-- Loop arrows -->
  <path d="M406 590 C428 590 444 590 468 590" fill="none" stroke="#536dfe" stroke-width="2.5" marker-end="url(#blueArrow)"/>
  <path d="M798 590 C822 590 838 590 861 590" fill="none" stroke="#159570" stroke-width="2.5" marker-end="url(#greenArrow)"/>
  <path d="M861 686 C680 735 355 735 260 670" fill="none" stroke="#536dfe" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#blueArrow)"/>
  <text x="563" y="733" text-anchor="middle" class="label">观察结果回流，继续下一轮</text>

  <!-- Draft and validation -->
  <rect x="1195" y="510" width="350" height="160" rx="16" fill="#fff7ed" stroke="#f4c78a" filter="url(#smallShadow)"/>
  <text x="1223" y="545" class="box-title">形成草案并交给系统校验</text>
  <text x="1223" y="577" class="box-text">Agent 负责地点组合、顺序、节奏和取舍</text>
  <text x="1223" y="601" class="box-text">系统负责日期、时间、抵离和路线规则</text>
  <text x="1223" y="625" class="box-text">模型不能直接写入坐标或路线详情</text>
  <text x="1223" y="649" class="box-text">只允许一次修正，避免无限自我重排</text>

  <path d="M1151 590 C1168 590 1177 590 1195 590" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#orangeArrow)"/>
  <path d="M1370 670 L1370 714" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#orangeArrow)"/>

  <!-- Validation result -->
  <rect x="1195" y="714" width="350" height="160" rx="16" fill="#ffffff" stroke="#f4c78a" filter="url(#smallShadow)"/>
  <text x="1223" y="749" class="box-title">确定性校验结果</text>
  <text x="1223" y="781" class="box-text">通过 → 进入结果沟通与保存</text>
  <text x="1223" y="805" class="box-text">冲突 → 反馈结构化问题给 Agent</text>
  <text x="1223" y="829" class="box-text">未知 → 标记待核实，不用模型猜测</text>
  <text x="1223" y="853" class="small">例如：路线需要 67 分钟，但窗口只有 45 分钟</text>

  <!-- Repair loop -->
  <path d="M1195 792 C1090 792 1040 725 1038 670" fill="none" stroke="#d97706" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#orangeArrow)"/>
  <text x="1078" y="765" class="label" fill="#a65b05">冲突反馈：修正一次</text>

  <!-- Terminal paths -->
  <path d="M1545 792 C1580 792 1586 792 1618 792" fill="none" stroke="#d97706" stroke-width="2.5" marker-end="url(#orangeArrow)"/>
  <rect x="1450" y="886" width="170" height="42" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="1535" y="912" text-anchor="middle" class="label">通过 / 可保存</text>

  <path d="M1195 865 C1050 922 750 923 406 670" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="7 7" marker-end="url(#grayArrow)"/>
  <text x="810" y="914" text-anchor="middle" class="label">需要用户决定 → waiting_user，不继续猜测</text>

  <!-- Final states -->
  <rect x="80" y="990" width="1540" height="150" rx="22" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="116" y="1026" class="panel-title">3 · 明确终态与结果语义</text>
  <rect x="116" y="1052" width="320" height="58" rx="13" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="276" y="1076" text-anchor="middle" class="box-title">completed</text>
  <text x="276" y="1097" text-anchor="middle" class="small">已验证的草案 / 修改结果</text>
  <rect x="475" y="1052" width="320" height="58" rx="13" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="635" y="1076" text-anchor="middle" class="box-title">waiting_user</text>
  <text x="635" y="1097" text-anchor="middle" class="small">重名、缺关键时间或需要取舍</text>
  <rect x="834" y="1052" width="320" height="58" rx="13" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="994" y="1076" text-anchor="middle" class="box-title">failed / budget_exhausted</text>
  <text x="994" y="1097" text-anchor="middle" class="small">原行程保留，返回失败原因</text>
  <rect x="1193" y="1052" width="395" height="58" rx="13" fill="#ecfdf5" stroke="#bbf7d0"/>
  <text x="1390" y="1076" text-anchor="middle" class="box-title">事实、校验、保存状态分开表达</text>
  <text x="1390" y="1097" text-anchor="middle" class="small">查询成功 ≠ 开放预约已确认</text>

  <!-- Footer -->
  <line x1="116" y1="1174" x2="1588" y2="1174" stroke="#dbe3ef"/>
  <circle cx="130" cy="1192" r="5" fill="#536dfe"/>
  <text x="144" y="1197" class="small">Agent 决策循环</text>
  <circle cx="310" cy="1192" r="5" fill="#159570"/>
  <text x="324" y="1197" class="small">外部事实工具</text>
  <circle cx="475" cy="1192" r="5" fill="#d97706"/>
  <text x="489" y="1197" class="small">确定性校验与保存</text>
  <text x="1588" y="1197" text-anchor="end" class="small">当前 Agent Loop 版本 · 讨论与验收图</text>
</svg>
