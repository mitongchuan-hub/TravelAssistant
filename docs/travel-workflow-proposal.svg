<text x="195.0" y="530" class="heading" text-anchor="middle">闲聊 · LLM</text>
<text x="195.0" y="559" class="body" text-anchor="middle">无工具调用</text>
<text x="195.0" y="584" class="body" text-anchor="middle">不运行 Agent Loop</text>
<text x="195.0" y="609" class="body" text-anchor="middle">直接生成聊天回复</text>
<rect x="410" y="560" width="310" height="140" rx="14" fill="#f3edff" stroke="#b29ccf" stroke-width="2"/>
<text x="565.0" y="595" class="heading" text-anchor="middle">LLM · 查询判断</text>
<text x="565.0" y="624" class="body" text-anchor="middle">理解问题与已有资料</text>
<text x="565.0" y="649" class="body" text-anchor="middle">选择工具或输出回答</text>
<text x="565.0" y="674" class="body" text-anchor="middle">结果返回后继续判断</text>
<rect x="410" y="780" width="310" height="130" rx="14" fill="#e9f7f5" stroke="#84b8b1" stroke-width="2"/>
<text x="565.0" y="815" class="heading" text-anchor="middle">工具 · 按需查询</text>
<text x="565.0" y="844" class="body" text-anchor="middle">读取上下文 / 天气</text>
<text x="565.0" y="869" class="body" text-anchor="middle">地点 / 美食 / 路线</text>
<text x="565.0" y="894" class="body" text-anchor="middle">返回来源、结果与未知</text>
<rect x="410" y="950" width="310" height="80" rx="14" fill="#ffffff" stroke="#c4d1df" stroke-width="2"/>
<text x="565.0" y="985" class="heading" text-anchor="middle">带来源的查询回答</text>
<text x="625" y="750" class="label" text-anchor="middle">需工具</text>
<text x="732" y="926" class="label" text-anchor="middle">完成</text>
<rect x="810" y="560" width="460" height="145" rx="14" fill="#ffffff" stroke="#c4d1df" stroke-width="2"/>
<text x="1040.0" y="595" class="heading" text-anchor="middle">需求收集（Agent 内部）</text>
<text x="1040.0" y="624" class="body" text-anchor="middle">LLM 理解本轮需求 → 需求工具读取、更新</text>
<text x="1040.0" y="649" class="body" text-anchor="middle">补充需求在这里处理</text>
<text x="1040.0" y="674" class="body" text-anchor="middle">仅补充：保存并回复；需要规划：继续检查</text>
<rect x="865" y="775" width="350" height="90" rx="14" fill="#edf4ff" stroke="#91b0cc" stroke-width="2"/>
<text x="1040.0" y="810" class="heading" text-anchor="middle">本次需求是否充足？</text>
<text x="1040.0" y="839" class="body" text-anchor="middle">检查创建页的五组必填信息</text>
<text x="889" y="891" class="label" text-anchor="middle">不足</text>
<text x="1197" y="891" class="label" text-anchor="middle">充足</text>
<text x="885" y="744" class="label" text-anchor="middle">需要生成行程时</text>
<text x="860" y="1280" class="label" text-anchor="middle">仅补充</text>
<rect x="810" y="905" width="200" height="120" rx="14" fill="#fff3ec" stroke="#d69b82" stroke-width="2"/>
<text x="910.0" y="940" class="heading" text-anchor="middle">提醒用户补充</text>
<text x="910.0" y="969" class="body" text-anchor="middle">说明缺少的信息</text>
<text x="910.0" y="994" class="body" text-anchor="middle">本轮结束，等待补充</text>
<rect x="1040" y="905" width="230" height="150" rx="14" fill="#f3edff" stroke="#b29ccf" stroke-width="2"/>
<text x="1155.0" y="940" class="heading" text-anchor="middle">LLM · 规划</text>
<text x="1155.0" y="969" class="body" text-anchor="middle">需求充足后开始</text>
<text x="1155.0" y="994" class="body" text-anchor="middle">按需选择旅行工具</text>
<text x="1155.0" y="1019" class="body" text-anchor="middle">生成完整文字行程</text>
<rect x="1040" y="1130" width="230" height="125" rx="14" fill="#e9f7f5" stroke="#84b8b1" stroke-width="2"/>
<text x="1155.0" y="1165" class="heading" text-anchor="middle">工具 · 旅行查询</text>
<text x="1155.0" y="1194" class="body" text-anchor="middle">天气 / 地点</text>
<text x="1155.0" y="1219" class="body" text-anchor="middle">美食 / 路线 / 上下文</text>
<text x="1155.0" y="1244" class="body" text-anchor="middle">返回实际查询结果</text>
<rect x="1040" y="1285" width="230" height="80" rx="14" fill="#ffffff" stroke="#c4d1df" stroke-width="2"/>
<text x="1155.0" y="1320" class="heading" text-anchor="middle">完整文字行程</text>
<text x="1185" y="1100" class="label" text-anchor="middle">需工具</text>
<text x="1246" y="1270" class="label" text-anchor="middle">完成</text>
<rect x="1360" y="560" width="250" height="140" rx="14" fill="#f3edff" stroke="#b29ccf" stroke-width="2"/>
<text x="1485.0" y="595" class="heading" text-anchor="middle">LLM · 修改</text>
<text x="1485.0" y="624" class="body" text-anchor="middle">理解当前行程与反馈</text>
<text x="1485.0" y="649" class="body" text-anchor="middle">按用户指定范围修改</text>
<text x="1485.0" y="674" class="body" text-anchor="middle">选工具或直接完成</text>
<rect x="1360" y="780" width="250" height="130" rx="14" fill="#e9f7f5" stroke="#84b8b1" stroke-width="2"/>
<text x="1485.0" y="815" class="heading" text-anchor="middle">工具 · 按需查询</text>
<text x="1485.0" y="844" class="body" text-anchor="middle">读取行程与查询依据</text>
<text x="1485.0" y="869" class="body" text-anchor="middle">必要时查询旅行资料</text>
<text x="1485.0" y="894" class="body" text-anchor="middle">不必每次都查外部信息</text>
<rect x="1360" y="950" width="250" height="80" rx="14" fill="#ffffff" stroke="#c4d1df" stroke-width="2"/>
<text x="1485.0" y="985" class="heading" text-anchor="middle">修改后的完整文字</text>
<text x="1540" y="750" class="label" text-anchor="middle">需工具</text>
<text x="1620" y="926" class="label" text-anchor="middle">完成</text>
<rect x="780" y="1440" width="520" height="140" rx="14" fill="#f3edff" stroke="#b29ccf" stroke-width="2"/>
<text x="1040.0" y="1475" class="heading" text-anchor="middle">LLM · 展示结构化（无工具）</text>
<text x="1040.0" y="1504" class="body" text-anchor="middle">完整文字 → 固定 Schema 的 JSON</text>
<text x="1040.0" y="1529" class="body" text-anchor="middle">按日期、活动、交通、用餐与提醒整理</text>
<text x="1040.0" y="1554" class="body" text-anchor="middle">不添加原文未提供的事实</text>
<rect x="780" y="1640" width="520" height="115" rx="14" fill="#edf4ff" stroke="#91b0cc" stroke-width="2"/>
<text x="1040.0" y="1675" class="heading" text-anchor="middle">程序 · JSON 格式校验</text>
<text x="1040.0" y="1704" class="body" text-anchor="middle">校验字段、类型与原文对应关系</text>
<text x="1040.0" y="1729" class="body" text-anchor="middle">通过 → 结构化展示；失败 → 原文展示</text>
<rect x="1330" y="1630" width="310" height="130" rx="14" fill="#fff3ec" stroke="#d69b82" stroke-width="2"/>
<text x="1485.0" y="1665" class="heading" text-anchor="middle">转换失败 → 使用原文</text>
<text x="1485.0" y="1694" class="body" text-anchor="middle">保留完整文字行程</text>
<text x="1485.0" y="1719" class="body" text-anchor="middle">前端回退到原文展示</text>
<text x="1485.0" y="1744" class="body" text-anchor="middle">不触发重新规划</text>
<text x="1170" y="1615" class="label" text-anchor="middle">展示 JSON</text>
<text x="1320" y="1675" class="label" text-anchor="middle">失败</text>
<rect x="380" y="1850" width="920" height="115" rx="14" fill="#edf4ff" stroke="#91b0cc" stroke-width="2"/>
<text x="840.0" y="1885" class="heading" text-anchor="middle">程序 · 统一结果处理</text>
<text x="840.0" y="1914" class="body" text-anchor="middle">核对任务有效性、需求修订号和行程快照，按结果保存</text>
<text x="840.0" y="1939" class="body" text-anchor="middle">只保留当前原文与展示 JSON；生成和修改替换当前行程</text>
<rect x="580" y="2040" width="520" height="75" rx="14" fill="#ffffff" stroke="#c4d1df" stroke-width="2"/>
<text x="840.0" y="2075" class="heading" text-anchor="middle">回复用户 / 前端行程展示</text>
<text x="45" y="2170" class="sub" text-anchor="start">转换 LLM 位于 Agent Loop 外，仅在生成或修改完整行程后调用；创建页五组必填。当前运行代码已接入此流程。</text>
</svg>