.heading{font-size:23px;font-weight:700;fill:#203b55}
.body{font-size:18px;fill:#526c86}
.label{font-size:18px;font-weight:600;fill:#536d87}
.agent-label{font-size:24px;font-weight:700;fill:#355f88}
.edge{fill:none;stroke:#647992;stroke-width:2.6;stroke-linejoin:round;marker-end:url(#arrow)}
.agent-frame{fill:#f0f5fb;stroke:#527da5;stroke-width:2.6;stroke-dasharray:10 7}
</style></defs>
