<rect x="440" y="270" width="800" height="100" rx="14" fill="#f3edff" stroke="#b29ccf" stroke-width="2"/>
<text x="840.0" y="305" class="heading" text-anchor="middle">LLM · 意图识别（无工具）</text>
<text x="840.0" y="334" class="body" text-anchor="middle">识别：闲聊 / 查询 / 规划 / 修改</text>
<text x="840.0" y="359" class="body" text-anchor="middle">结合当前消息、相关对话和规划补充状态</text>
