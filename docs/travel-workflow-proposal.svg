<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="2200" viewBox="0 0 1680 2200" role="img" aria-labelledby="title desc">
<title id="title">TravelAssistant：四类意图、Agent Loop 与展示结构化</title>
<desc id="desc">先识别闲聊、查询、规划、修改四类意图。闲聊使用无工具 LLM，其余三条业务路径使用带工具 Agent Loop。需求补充在规划 Agent 内，需求不足时提醒补充。规划或修改交付完整文字后，共用一个无工具 LLM 转换展示 JSON，程序校验后保存与展示，转换失败则使用原文。</desc>
